# Сборка подписанного APK и публикация в GitHub Releases при пуше тега v*.
#   git tag v1.0.0 && git push origin v1.0.0
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY  — как для сайта (publishable-ключ)
#   ANDROID_KEYSTORE_BASE64          — upload-keystore.jks в base64
#   ANDROID_KEYSTORE_PASSWORD        — пароль от него (alias: upload)
name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - name: Тесты логики
        run: cargo test -p minus27-core -p minus27-data

      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "password=$PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Сборка APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # NDK уже есть на раннере: переменная машины, в контексте ${{ env }} её не видно.
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "NDK: $NDK_HOME"
          cargo tauri android build --apk --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "minus-27-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: minus-27-*.apk
          generate_release_notes: true
